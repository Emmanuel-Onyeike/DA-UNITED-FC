<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-[#080C14] text-gray-100 font-sans antialiased selection:bg-cyan-500 selection:text-black pb-16 md:pb-0 overflow-x-hidden">

    <!-- Modal -->

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="fixed inset-0 z-50 pointer-events-none hidden">
        <div id="drawer-backdrop" onclick="toggleDrawer()" class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity"></div>
        <div id="drawer-content" class="absolute top-0 right-0 h-full w-72 bg-[#080C14]/95 border-l border-slate-800/80 p-6 flex flex-col translate-x-full transition-transform">
            <!-- Drawer content same as before -->
            <div>
                <div class="flex justify-between pb-6 border-b border-slate-800/60 mb-8">
                    <span class="text-[10px] font-mono font-bold tracking-[0.2em] text-cyan-400 uppercase">Navigation</span>
                    <button onclick="toggleDrawer()" class="w-8 h-8 rounded border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                        ✕
                    </button>
                </div>
                <nav class="flex flex-col space-y-4 text-xs font-bold tracking-[0.2em]">
                    <a href="index.html" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">HOME</a>
                    <a href="games.html" class="electric-text py-2 border-b border-cyan-500/10">GAMES</a>
                    <a href="squad.html" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">SQUAD</a>
                    <a href="news.html" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">NEWS</a>
                    <a href="kits.html" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">KITS</a>
                    <a href="gallery.html" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">GALLERY</a>
                    <a href="sponsorship.html" class="text-slate-400 hover:text-cyan-400 py-2">SPONSORSHIP</a>
                </nav>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="border-b border-slate-800/80 bg-[#080C14]/90 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg border border-cyan-500/30 flex items-center justify-center bg-cyan-950/40">
                        <img src="IMG_5489.PNG" alt="Crest" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <span class="font-black tracking-wider text-lg">D.A <span class="electric-text">UNITED</span></span>
                    </div>
                </div>

                <div class="hidden md:flex space-x-8 text-xs font-bold tracking-widest">
                    <a href="index.html" class="text-slate-400 hover:text-cyan-400">HOME</a>
                    <a href="games.html" class="electric-text relative after:absolute after:bottom-[-22px] after:left-0 after:right-0 after:h-[2px] after:bg-cyan-400">GAMES</a>
                    <a href="squad.html" class="text-slate-400 hover:text-cyan-400">SQUAD</a>
                    <a href="news.html" class="text-slate-400 hover:text-cyan-400">NEWS</a>
                    <a href="kits.html" class="text-slate-400 hover:text-cyan-400">KITS</a>
                    <a href="gallery.html" class="text-slate-400 hover:text-cyan-400">GALLERY</a>
                    <a href="sponsorship.html" class="text-slate-400 hover:text-cyan-400">SPONSORSHIP</a>
                </div>

                <button onclick="toggleDrawer()" class="md:hidden w-10 h-10 rounded border border-slate-800 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>

    <main class="max-w-5xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <span class="text-[9px] font-mono tracking-[0.3em] bg-cyan-950/40 border border-cyan-800/50 px-4 py-1 rounded">MATCH CENTRE</span>
            <h1 class="text-4xl md:text-5xl font-black mt-4">CAMPAIGN SCHEDULES</h1>
        </header>

        <div id="matches-container" class="space-y-10">
            <!-- Matches loaded from Supabase will appear here -->
        </div>

        <div id="empty-state" class="tactical-card p-16 text-center rounded-2xl hidden">
            <p class="text-slate-400">No matches scheduled yet.</p>
        </div>
    </main>
<script src="config.js"></script>
    <script>
        const SUPABASE_URL = "https://mddlkobjiquicopymipy.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kZGxrb2JqaXF1aWNvcHltaXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMTk1NzksImV4cCI6MjA4MTg5NTU3OX0.QQhDBtqFpgs12DZNmhlsHm2Xf0OllR_5LT3i0A-5IjQ";

        let currentTimers = {};

        async function loadMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/matches?order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const matches = await res.json();

                if (matches.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                document.getElementById('empty-state').classList.add('hidden');

                matches.forEach(match => {
                    const matchEl = createMatchElement(match);
                    container.appendChild(matchEl);
                });
            } catch (err) {
                console.error(err);
                triggerAlert("Failed to load matches");
            }
        }

        function createMatchElement(match) {
            const div = document.createElement('div');
            div.className = `tactical-card rounded-2xl overflow-hidden border ${match.status === 'LIVE' ? 'border-red-500/40' : 'border-slate-700'}`;
            div.innerHTML = `
                <div class="bg-slate-950/60 px-5 py-2 flex justify-between items-center text-xs font-mono">
                    <span>${match.competition || 'FRIENDLY'}</span>
                    <span class="status-label ${match.status === 'LIVE' ? 'text-red-400 animate-pulse' : 'text-cyan-400'}">
                        ${match.status || 'UPCOMING'}
                    </span>
                </div>

                <div class="p-6 grid grid-cols-3 items-center">
                    <!-- Home Team -->
                    <div class="text-center">
                        <div class="text-lg font-black">${match.home_team}</div>
                        <div class="text-4xl font-black text-white mt-2 home-score">${match.home_score || 0}</div>
                    </div>

                    <!-- Center -->
                    <div class="text-center">
                        <div class="flex justify-center items-center gap-3 text-5xl font-black">
                            <span class="home-score">${match.home_score || 0}</span>
                            <span class="text-slate-500">:</span>
                            <span class="away-score">${match.away_score || 0}</span>
                        </div>
                        <div id="timer-${match.id}" class="mt-3 text-cyan-400 font-mono text-xl font-bold">
                            ${match.time_display || '00:00'}
                        </div>
                    </div>

                    <!-- Away Team -->
                    <div class="text-center">
                        <div class="text-lg font-black">${match.away_team}</div>
                        <div class="text-4xl font-black text-white mt-2 away-score">${match.away_score || 0}</div>
                    </div>
                </div>

                <!-- Scorers -->
                <div class="grid grid-cols-2 border-t border-slate-800 text-xs">
                    <div class="p-4 border-r border-slate-800 home-scorers">
                        ${renderScorers(match.home_scorers || [])}
                    </div>
                    <div class="p-4 away-scorers">
                        ${renderScorers(match.away_scorers || [])}
                    </div>
                </div>

                <!-- Cards -->
                <div class="grid grid-cols-2 border-t border-slate-800 text-xs p-4 gap-4">
                    <div class="home-cards">${renderCards(match.home_cards || [])}</div>
                    <div class="away-cards text-right">${renderCards(match.away_cards || [])}</div>
                </div>
            `;
            return div;
        }

        function renderScorers(scorers) {
            if (!scorers.length) return '<p class="text-slate-500 text-[10px]">No goals yet</p>';
            return scorers.map(s => `
                <div>${s.player} <span class="text-cyan-400">(${s.minute}')</span> ${s.type ? `<span class="text-amber-400">[${s.type}]</span>` : ''}</div>
            `).join('');
        }

        function renderCards(cards) {
            if (!cards.length) return '';
            return cards.map(c => `
                <span class="inline-block px-2 py-0.5 rounded ${c.color === 'red' ? 'bg-red-500/20 text-red-400' : 'bg-amber-500/20 text-amber-400'}">
                    ${c.player} ${c.minute}'
                </span>
            `).join('');
        }

        function toggleModal() {
            document.getElementById('modal-container').classList.toggle('hidden');
        }

        function triggerAlert(msg) {
            document.getElementById('modal-text').innerText = msg;
            toggleModal();
        }

        function toggleDrawer() {
            const drawer = document.getElementById('mobile-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            const content = document.getElementById('drawer-content');

            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    backdrop.classList.replace('opacity-0', 'opacity-100');
                    content.classList.replace('translate-x-full', 'translate-x-0');
                }, 10);
            } else {
                backdrop.classList.replace('opacity-100', 'opacity-0');
                content.classList.replace('translate-x-0', 'translate-x-full');
                setTimeout(() => drawer.classList.add('hidden'), 300);
            }
        }

        // Load matches on page load
        window.onload = loadMatches;
    </script>
</body>
</html>
