<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.A UNITED | Media Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .tactical-card {
            background: rgba(10, 15, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.1);
        }
        .electric-text {
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body class="bg-[#080C14] text-gray-100 font-sans antialiased selection:bg-cyan-500 selection:text-black pb-16 md:pb-0 overflow-x-hidden">

    <!-- Modal -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm hidden">
        <div class="tactical-card p-6 rounded-xl max-w-sm w-full border border-cyan-500/40">
            <h3 class="text-lg font-bold text-white tracking-wide uppercase mb-2">System Notice</h3>
            <p id="modal-text" class="text-xs text-slate-400 mb-6 leading-relaxed font-mono"></p>
            <button onclick="toggleModal()" class="w-full text-xs font-bold bg-cyan-500 text-black py-2.5 rounded hover:bg-cyan-400 transition tracking-wider uppercase">Acknowledge</button>
        </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="fixed inset-0 z-50 pointer-events-none hidden">
        <div id="drawer-backdrop" onclick="toggleDrawer()" class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity"></div>
        <div id="drawer-content" class="absolute top-0 right-0 h-full w-72 bg-[#080C14]/95 border-l border-slate-800/80 p-6 flex flex-col translate-x-full transition-transform">
            <div>
                <div class="flex justify-between pb-6 border-b border-slate-800/60 mb-8">
                    <span class="text-[10px] font-mono font-bold tracking-[0.2em] text-cyan-400 uppercase">Navigation</span>
                    <button onclick="toggleDrawer()" class="w-8 h-8 rounded border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white">✕</button>
                </div>
                <nav class="flex flex-col space-y-4 text-xs font-bold tracking-[0.2em]">
                    <a href="index.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">HOME</a>
                    <a href="games.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">GAMES</a>
                    <a href="squad.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">SQUAD</a>
                    <a href="news.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">NEWS</a>
                    <a href="kits.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2 border-b border-slate-800/30">KITS</a>
                    <a href="gallery.html" onclick="toggleDrawer()" class="electric-text py-2 border-b border-cyan-500/10">GALLERY</a>
                    <a href="sponsorship.html" onclick="toggleDrawer()" class="text-slate-400 hover:text-cyan-400 py-2">SPONSORSHIP</a>
                </nav>
            </div>
        </div>
    </div>

    <!-- Navigation Header -->
    <nav class="border-b border-slate-800/80 bg-[#080C14]/90 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg border border-cyan-500/30 flex items-center justify-center bg-cyan-950/40">
                        <img src="IMG_5489.PNG" alt="Crest" class="w-full h-full object-contain">
                    </div>
                    <div class="font-black tracking-wider text-lg">D.A <span class="electric-text">UNITED</span></div>
                </div>

                <div class="hidden md:flex space-x-8 text-xs font-bold tracking-widest">
                    <a href="index.html" class="text-slate-400 hover:text-cyan-400">HOME</a>
                    <a href="games.html" class="text-slate-400 hover:text-cyan-400">GAMES</a>
                    <a href="squad.html" class="text-slate-400 hover:text-cyan-400">SQUAD</a>
                    <a href="news.html" class="text-slate-400 hover:text-cyan-400">NEWS</a>
                    <a href="kits.html" class="text-slate-400 hover:text-cyan-400">KITS</a>
                    <a href="gallery.html" class="electric-text relative after:absolute after:bottom-[-22px] after:left-0 after:right-0 after:h-[2px] after:bg-cyan-400">GALLERY</a>
                    <a href="sponsorship.html" class="text-slate-400 hover:text-cyan-400">SPONSORSHIP</a>
                </div>

                <button onclick="toggleDrawer()" class="md:hidden w-10 h-10 rounded border border-slate-800 flex items-center justify-center text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12 pb-28">
        <header class="mb-12 text-center md:text-left">
            <span class="text-[9px] font-mono font-bold tracking-[0.3em] text-cyan-400 uppercase bg-cyan-950/40 border border-cyan-800/50 px-3 py-1 rounded">MEDIA ASSETS</span>
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight uppercase">MEDIA VAULT</h1>
            <p class="text-xs text-slate-400 max-w-sm mt-2 leading-relaxed">All official media synchronized from Admin HQ.</p>
        </header>

        <div id="albums-container" class="space-y-10">
            <!-- Albums and their media will load here -->
        </div>

        <div id="empty-state" class="tactical-card p-16 text-center rounded-2xl hidden">
            <p class="text-slate-400">No media albums available yet. Add them from Admin HQ.</p>
        </div>
    </main>
<script src="config.js"></script>
    <script>
        const SUPABASE_URL = "https://mddlkobjiquicopymipy.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kZGxrb2JqaXF1aWNvcHltaXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMTk1NzksImV4cCI6MjA4MTg5NTU3OX0.QQhDBtqFpgs12DZNmhlsHm2Xf0OllR_5LT3i0A-5IjQ";

        async function loadGallery() {
            const container = document.getElementById('albums-container');
            const emptyState = document.getElementById('empty-state');

            try {
                // Fetch albums with their media (using join)
                const res = await fetch(`${SUPABASE_URL}/rest/v1/albums?select=*,media(*)`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                const albums = await res.json();

                if (albums.length === 0) {
                    container.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');
                container.innerHTML = '';

                albums.forEach(album => {
                    const mediaItems = album.media || [];

                    const albumHTML = `
                        <div class="mb-8">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-xl font-black tracking-wide">${album.name}</h2>
                                <span class="text-xs font-mono text-cyan-400 bg-cyan-950/40 px-3 py-1 rounded">${mediaItems.length} items</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                                ${mediaItems.map(item => `
                                    <div class="tactical-card rounded-xl overflow-hidden group cursor-pointer">
                                        <div class="aspect-video bg-slate-900 relative">
                                            <img src="${item.image_url}" class="w-full h-full object-cover transition-transform group-hover:scale-105" alt="${item.title}">
                                        </div>
                                        <div class="p-3">
                                            <p class="text-xs font-medium text-white line-clamp-1">${item.title}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    container.innerHTML += albumHTML;
                });

            } catch (err) {
                console.error(err);
                triggerAlert("Failed to load gallery. Check connection.");
            }
        }

        function toggleModal() {
            document.getElementById('modal-container').classList.toggle('hidden');
        }

        function triggerAlert(message) {
            document.getElementById('modal-text').innerText = message;
            toggleModal();
        }

        function toggleDrawer() {
            const drawer = document.getElementById('mobile-drawer');
            const backdrop = document.getElementById('drawer-backdrop');
            const content = document.getElementById('drawer-content');

            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    backdrop.classList.replace('opacity-0', 'opacity-100');
                    content.classList.replace('translate-x-full', 'translate-x-0');
                }, 10);
            } else {
                backdrop.classList.replace('opacity-100', 'opacity-0');
                content.classList.replace('translate-x-0', 'translate-x-full');
                setTimeout(() => drawer.classList.add('hidden'), 300);
            }
        }

// Load gallery on page load
        window.addEventListener('DOMContentLoaded', loadGallery);
        
        // Auto-refresh every 10 seconds
        setInterval(loadGallery, 10000);
    </script>
</body>
</html>
